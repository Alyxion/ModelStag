[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelstag"
version = "0.1.0"
description = "Multi-model hosting system for AI vision models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "rembg[cpu]>=2.0.50",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "python-multipart>=0.0.6",
    "transformers (>=4.46.0,<4.50.0)",
    "einops (>=0.8.2,<0.9.0)",
    "timm (>=1.0.24,<2.0.0)",
    "mediapipe>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]
sam = [
    "segment-anything>=1.0",
]
depth = [
    "transformers>=4.36.0,<5.0.0",
]
detect = [
    "ultralytics>=8.1.0",
]
caption = [
    "transformers>=4.36.0,<5.0.0",
]
pose = [
    "mmpose>=1.3.0",
    "mmdet>=3.2.0",
    "mmcv>=2.1.0",
    "mmengine>=0.10.0",
]
hand = [
    "hamer @ git+https://github.com/geopavlakos/hamer.git",
]
all = [
    "segment-anything>=1.0",
    "transformers>=4.36.0,<5.0.0",
    "ultralytics>=8.1.0",
    "mediapipe>=0.10.0",
    "mmpose>=1.3.0",
    "mmdet>=3.2.0",
    "mmcv>=2.1.0",
    "mmengine>=0.10.0",
]

[project.scripts]
modelstag = "modelstag.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modelstag"]
