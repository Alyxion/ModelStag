        function fitBilinearSurface(width, height) {
            // Fit z = a + b*x + c*y + d*x*y using ONLY the clicked points (exact interpolation)
            // This guarantees the surface passes through all reference points
            if (surfacePoints.length < 3) return null;

            const pts = surfacePoints.map(p => ({ x: p.x, y: p.y, z: p.z }));
            const n = pts.length;

            // Build matrix A and vector B for least squares (or exact if n=4)
            // z = a + b*x + c*y + d*xy  =>  [1, x, y, xy] * [a, b, c, d]' = z
            const A = pts.map(p => [1, p.x, p.y, p.x * p.y]);
            const B = pts.map(p => p.z);

            let coeffs;
            if (n === 4) {
                // Exact solution
                coeffs = solveLinearSystem(A, B);
            } else {
                // Least squares: (A'A)^-1 * A'B
                const AT = [[], [], [], []];
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < n; j++) {
                        AT[i][j] = A[j][i];
                    }
                }
                // ATA = AT * A (4x4)
                const ATA = [];
                for (let i = 0; i < 4; i++) {
                    ATA[i] = [];
                    for (let j = 0; j < 4; j++) {
                        let sum = 0;
                        for (let k = 0; k < n; k++) sum += AT[i][k] * A[k][j];
                        ATA[i][j] = sum;
                    }
                }
                // ATB = AT * B (4x1)
                const ATB = [];
                for (let i = 0; i < 4; i++) {
                    let sum = 0;
                    for (let k = 0; k < n; k++) sum += AT[i][k] * B[k];
                    ATB[i] = sum;
                }
                coeffs = solveLinearSystem(ATA, ATB);
            }

            if (!coeffs) return null;
            const [a, b, c, d] = coeffs;

            // Compute residuals at reference points
            let maxDiff = 0;
            for (const p of pts) {
                const expected = a + b*p.x + c*p.y + d*p.x*p.y;
                maxDiff = Math.max(maxDiff, Math.abs(p.z - expected));
            }

            // Set a reasonable tolerance (should be near 0 for exact fit)
            const suggestedTolerance = Math.max(10, Math.round(maxDiff * 2 + 5));
            document.getElementById('surfaceTolerance').value = suggestedTolerance;
            document.getElementById('surfaceToleranceDisplay').textContent = suggestedTolerance;

            // Compute gradient (dz/dx, dz/dy) at center of reference points
            // For z = a + b*x + c*y + d*xy:
            //   dz/dx = b + d*y
            //   dz/dy = c + d*x
            const cx = surfacePoints.reduce((s, p) => s + p.x, 0) / surfacePoints.length;
            const cy = surfacePoints.reduce((s, p) => s + p.y, 0) / surfacePoints.length;
            const dzdx = b + d*cy;
            const dzdy = c + d*cx;
            const gradientMag = Math.sqrt(dzdx*dzdx + dzdy*dzdy);

            console.log(`\n=== Bilinear Surface (${n} points, exact fit) ===`);
            console.log(`z = ${a.toFixed(2)} + ${b.toFixed(4)}*x + ${c.toFixed(4)}*y + ${d.toFixed(6)}*xy`);
            console.log(`Gradient at center (${cx.toFixed(0)}, ${cy.toFixed(0)}): dzdx=${dzdx.toFixed(4)}, dzdy=${dzdy.toFixed(4)}`);
            console.log(`Max residual at ref points: ${maxDiff.toFixed(4)}`);

            return {
                type: 'bilinear',
                a, b, c, d,
                dzdx, dzdy,  // Include dzdx, dzdy for normal computation
                depthTransform: 'bilinear',
                orientation: 'bilinear interpolation',
                gradientMag
            };
        }

        function fitQuadraticSurface(samples, width, height) {
            // Fit z = a*x² + b*y² + c*xy + d*x + e*y + f
            // Using least squares with 6 parameters
            const n = samples.length;
            if (n < 6) return null;

            // Build normal equations matrix (6x6) and vector (6x1)
            // Variables: [a, b, c, d, e, f] for [x², y², xy, x, y, 1]
            let sums = {};
            const keys = ['x4', 'x2y2', 'x3y', 'x3', 'x2y', 'x2',
                          'y4', 'xy3', 'xy2', 'y3', 'y2',
                          'x2y2_2', 'x2y', 'xy2_2', 'xy',
                          'x', 'y', '1',
                          'x2z', 'y2z', 'xyz', 'xz', 'yz', 'z'];
            keys.forEach(k => sums[k] = 0);

            for (const s of samples) {
                const x = s.x, y = s.y, z = s.z;
                const x2 = x*x, y2 = y*y, xy = x*y;
                const x3 = x2*x, y3 = y2*y;
                const x4 = x2*x2, y4 = y2*y2;
                const x2y = x2*y, xy2 = x*y2, x2y2 = x2*y2;
                const x3y = x3*y, xy3 = x*y3;

                sums['x4'] += x4; sums['x2y2'] += x2y2; sums['x3y'] += x3y;
                sums['x3'] += x3; sums['x2y'] += x2y; sums['x2'] += x2;
                sums['y4'] += y4; sums['xy3'] += xy3; sums['xy2'] += xy2;
                sums['y3'] += y3; sums['y2'] += y2;
                sums['xy'] += xy; sums['x'] += x; sums['y'] += y;
                sums['x2z'] += x2*z; sums['y2z'] += y2*z; sums['xyz'] += xy*z;
                sums['xz'] += x*z; sums['yz'] += y*z; sums['z'] += z;
            }

            // 6x6 matrix for [a, b, c, d, e, f]
            const A = [
                [sums['x4'],   sums['x2y2'], sums['x3y'],  sums['x3'],  sums['x2y'], sums['x2']],
                [sums['x2y2'], sums['y4'],   sums['xy3'],  sums['x2y'], sums['y3'],  sums['y2']],
                [sums['x3y'],  sums['xy3'],  sums['x2y2'], sums['x2y'], sums['xy2'], sums['xy']],
                [sums['x3'],   sums['x2y'], sums['x2y'],  sums['x2'],  sums['xy'],  sums['x']],
                [sums['x2y'],  sums['y3'],   sums['xy2'],  sums['xy'],  sums['y2'],  sums['y']],
                [sums['x2'],   sums['y2'],   sums['xy'],   sums['x'],   sums['y'],   n]
            ];
            const B = [sums['x2z'], sums['y2z'], sums['xyz'], sums['xz'], sums['yz'], sums['z']];

            // Solve using Gaussian elimination with partial pivoting
            const coeffs = solveLinearSystem(A, B);
            if (!coeffs) return null;

            const [a, b, c, d, e, f] = coeffs;

            // Compute residuals
            let sumResidual = 0;
            for (const s of samples) {
                const predicted = a*s.x*s.x + b*s.y*s.y + c*s.x*s.y + d*s.x + e*s.y + f;
                sumResidual += Math.abs(s.zOrig - predicted);
            }
            const avgResidual = sumResidual / n;
            const suggestedTolerance = Math.max(5, Math.min(50, Math.round(avgResidual * 2.5)));

            document.getElementById('surfaceTolerance').value = suggestedTolerance;
            document.getElementById('surfaceToleranceDisplay').textContent = suggestedTolerance;

            // Compute gradient (dz/dx, dz/dy) at center of reference points
            // For z = a*x² + b*y² + c*xy + d*x + e*y + f:
            //   dz/dx = 2*a*x + c*y + d
            //   dz/dy = 2*b*y + c*x + e
            const cx = surfacePoints.reduce((s, p) => s + p.x, 0) / surfacePoints.length;
            const cy = surfacePoints.reduce((s, p) => s + p.y, 0) / surfacePoints.length;
            const dzdx = 2*a*cx + c*cy + d;
            const dzdy = 2*b*cy + c*cx + e;
            const gradientMag = Math.sqrt(dzdx*dzdx + dzdy*dzdy);

            console.log(`\n=== Quadratic Surface (${surfacePoints.length} points) ===`);
            console.log(`z = ${a.toFixed(6)}*x² + ${b.toFixed(6)}*y² + ${c.toFixed(6)}*xy + ${d.toFixed(4)}*x + ${e.toFixed(4)}*y + ${f.toFixed(2)}`);
            console.log(`Gradient at center (${cx.toFixed(0)}, ${cy.toFixed(0)}): dzdx=${dzdx.toFixed(4)}, dzdy=${dzdy.toFixed(4)}`);
            console.log(`Suggested tolerance: ${suggestedTolerance}`);

            return {
                type: 'quadratic',
                a, b, c, d, e, f,
                dzdx, dzdy,  // Gradient at center for normal vector
                depthTransform: 'quadratic',
                orientation: 'curved surface',
                gradientMag
            };
        }

        function solveLinearSystem(A, B) {
            // Gaussian elimination with partial pivoting
            const n = A.length;
            const aug = A.map((row, i) => [...row, B[i]]);

            for (let col = 0; col < n; col++) {
                // Find pivot
                let maxRow = col;
                for (let row = col + 1; row < n; row++) {
                    if (Math.abs(aug[row][col]) > Math.abs(aug[maxRow][col])) {
                        maxRow = row;
                    }
                }
                [aug[col], aug[maxRow]] = [aug[maxRow], aug[col]];

                if (Math.abs(aug[col][col]) < 1e-10) return null;

                // Eliminate
                for (let row = col + 1; row < n; row++) {
                    const factor = aug[row][col] / aug[col][col];
                    for (let j = col; j <= n; j++) {
                        aug[row][j] -= factor * aug[col][j];
                    }
                }
            }

            // Back substitution
            const x = new Array(n);
            for (let i = n - 1; i >= 0; i--) {
                x[i] = aug[i][n];
                for (let j = i + 1; j < n; j++) {
                    x[i] -= aug[i][j] * x[j];
                }
                x[i] /= aug[i][i];
            }
            return x;
        }

        function computeSurfacePlaneMulti(width, height) {
            if (surfacePoints.length === 0) return null;

            const depthTransform = document.getElementById('depthTransform')?.value || 'linear';

            // Collect samples from 16x16 area around each reference point
            // Also include shift-clicked IN points for better surface fitting
            const halfSize = 8;
            const allSamples = [];

            // Collect from reference points (used for polygon/normals)
            for (const pt of surfacePoints) {
                for (let dy = -halfSize; dy < halfSize; dy++) {
                    for (let dx = -halfSize; dx < halfSize; dx++) {
                        const px = pt.x + dx;
                        const py = pt.y + dy;
                        if (px >= 0 && px < width && py >= 0 && py < height) {
                            let z = depthData.data[(py * width + px) * 4];
                            let zTransformed;
                            if (depthTransform === 'inverse' && z > 0) {
                                zTransformed = 1.0 / z;
                            } else if (depthTransform === 'log' && z > 0) {
                                zTransformed = Math.log(z);
                            } else if (depthTransform !== 'linear' && depthTransform !== 'quadratic' && z <= 0) {
                                continue;
                            } else {
                                zTransformed = z;
                            }
                            allSamples.push({ x: px, y: py, z: zTransformed, zOrig: z });
                        }
                    }
                }
            }

            // Also collect samples from shift-clicked IN test points (for better surface fitting)
            // These help the quadratic/curved surfaces fit the interior better
            for (const pt of testPointsIn) {
                for (let dy = -halfSize; dy < halfSize; dy++) {
                    for (let dx = -halfSize; dx < halfSize; dx++) {
                        const px = pt.x + dx;
                        const py = pt.y + dy;
                        if (px >= 0 && px < width && py >= 0 && py < height) {
                            let z = depthData.data[(py * width + px) * 4];
                            let zTransformed;
                            if (depthTransform === 'inverse' && z > 0) {
                                zTransformed = 1.0 / z;
                            } else if (depthTransform === 'log' && z > 0) {
                                zTransformed = Math.log(z);
                            } else if (depthTransform !== 'linear' && depthTransform !== 'quadratic' && z <= 0) {
                                continue;
                            } else {
                                zTransformed = z;
                            }
                            allSamples.push({ x: px, y: py, z: zTransformed, zOrig: z });
                        }
                    }
                }
            }

            // Quadratic surface fitting: z = a*x² + b*y² + c*xy + d*x + e*y + f
            if (depthTransform === 'quadratic') {
                return fitQuadraticSurface(allSamples, width, height);
            }

            // Bilinear exact interpolation: z = a + b*x + c*y + d*xy (uses only clicked points)
            if (depthTransform === 'bilinear') {
                return fitBilinearSurface(width, height);
            }

            // Fit plane using least squares: f(z) = a*x + b*y + c
            let sumX = 0, sumY = 0, sumZ = 0;
            let sumXX = 0, sumYY = 0, sumXY = 0;
            let sumXZ = 0, sumYZ = 0;
            const n = allSamples.length;

            for (const s of allSamples) {
                sumX += s.x;
                sumY += s.y;
                sumZ += s.z;
                sumXX += s.x * s.x;
                sumYY += s.y * s.y;
                sumXY += s.x * s.y;
                sumXZ += s.x * s.z;
                sumYZ += s.y * s.z;
            }

            // Solve 3x3 system using Cramer's rule
            const A = [
                [sumXX, sumXY, sumX],
                [sumXY, sumYY, sumY],
                [sumX,  sumY,  n]
            ];
            const B = [sumXZ, sumYZ, sumZ];

            function det3(m) {
                return m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1])
                     - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0])
                     + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
            }

            const detA = det3(A);
            let dzdx = 0, dzdy = 0, c = sumZ / n;

            if (Math.abs(detA) > 0.001) {
                const Aa = [[B[0], A[0][1], A[0][2]], [B[1], A[1][1], A[1][2]], [B[2], A[2][1], A[2][2]]];
                const Ab = [[A[0][0], B[0], A[0][2]], [A[1][0], B[1], A[1][2]], [A[2][0], B[2], A[2][2]]];
                const Ac = [[A[0][0], A[0][1], B[0]], [A[1][0], A[1][1], B[1]], [A[2][0], A[2][1], B[2]]];

                dzdx = det3(Aa) / detA;
                dzdy = det3(Ab) / detA;
                c = det3(Ac) / detA;
            }

            // Compute residuals to suggest initial tolerance (in linear depth space)
            let sumResidual = 0;
            for (const s of allSamples) {
                const predictedFit = dzdx * s.x + dzdy * s.y + c;
                let predictedLinear;
                if (depthTransform === 'inverse') {
                    predictedLinear = 1.0 / predictedFit;
                } else if (depthTransform === 'log') {
                    predictedLinear = Math.exp(predictedFit);
                } else {
                    predictedLinear = predictedFit;
                }
                sumResidual += Math.abs(s.zOrig - predictedLinear);
            }
            const avgResidual = sumResidual / n;
            const suggestedTolerance = Math.max(5, Math.min(50, Math.round(avgResidual * 2.5)));

            // Describe the plane orientation
            const gradientMag = Math.sqrt(dzdx * dzdx + dzdy * dzdy);
            let orientation = "flat";
            if (gradientMag > 0.05) {
                const angle = Math.atan2(dzdy, dzdx) * 180 / Math.PI;
                if (angle > -22.5 && angle <= 22.5) orientation = "tilted right (→)";
                else if (angle > 22.5 && angle <= 67.5) orientation = "tilted down-right (↘)";
                else if (angle > 67.5 && angle <= 112.5) orientation = "tilted down (↓)";
                else if (angle > 112.5 && angle <= 157.5) orientation = "tilted down-left (↙)";
                else if (angle > 157.5 || angle <= -157.5) orientation = "tilted left (←)";
                else if (angle > -157.5 && angle <= -112.5) orientation = "tilted up-left (↖)";
                else if (angle > -112.5 && angle <= -67.5) orientation = "tilted up (↑)";
                else orientation = "tilted up-right (↗)";
            }

            console.log(`\n=== Surface Plane (${surfacePoints.length} points, ${depthTransform}) ===`);
            if (depthTransform === 'inverse') {
                console.log(`Equation: 1/z = ${dzdx.toFixed(8)}*x + ${dzdy.toFixed(8)}*y + ${c.toFixed(6)}`);
            } else if (depthTransform === 'log') {
                console.log(`Equation: log(z) = ${dzdx.toFixed(6)}*x + ${dzdy.toFixed(6)}*y + ${c.toFixed(2)}`);
            } else {
                console.log(`Equation: z = ${dzdx.toFixed(6)}*x + ${dzdy.toFixed(6)}*y + ${c.toFixed(2)}`);
            }
            console.log(`Orientation: ${orientation}, gradient magnitude: ${gradientMag.toFixed(6)}`);
            console.log(`Suggested tolerance: ${suggestedTolerance}`);
            console.log(`\nReference points:`);
            for (let i = 0; i < surfacePoints.length; i++) {
                const pt = surfacePoints[i];
                const fitValue = dzdx * pt.x + dzdy * pt.y + c;
                let expectedZ;
                if (depthTransform === 'inverse' && pt.z > 0 && fitValue > 0) {
                    expectedZ = 1.0 / fitValue;
                } else if (depthTransform === 'log' && pt.z > 0) {
                    expectedZ = Math.exp(fitValue);
                } else {
                    expectedZ = fitValue;
                }
                const diff = pt.z - expectedZ;
                console.log(`  P${i+1}: (${pt.x}, ${pt.y}) z=${pt.z} | expected=${expectedZ.toFixed(2)} | diff=${diff.toFixed(2)}`);
            }

            // Set the slider to the suggested value
            const toleranceSlider = document.getElementById('surfaceTolerance');
            toleranceSlider.value = suggestedTolerance;
            document.getElementById('surfaceToleranceDisplay').textContent = suggestedTolerance;

            return { dzdx, dzdy, c, orientation, gradientMag, depthTransform };
        }

        function drawSurfaceVisualization(ctx, w, h, showInfoBox = false) {
            if (!surfacePlane || surfacePoints.length === 0) return;

            // Get gradient values with fallback to 0
            const dzdx = surfacePlane.dzdx || 0;
            const dzdy = surfacePlane.dzdy || 0;

            // Scale factor based on image size (baseline: 1000px for half-size elements)
            const scale = Math.max(w, h) / 1000;
            const markerRadius = Math.max(6, Math.round(10 * scale));
            const dotRadius = Math.max(2, Math.round(3 * scale));
            const lineWidth = Math.max(1, Math.round(2 * scale));
            const thinLine = Math.max(1, Math.round(1.5 * scale));
            const fontSize = Math.max(10, Math.round(12 * scale));
            const dashSize = Math.max(3, Math.round(5 * scale));

            // Draw reference points with labels
            const colors = ['#ff0000', '#00ff00', '#0088ff', '#ff00ff'];
            const labels = getPointLabels();

            for (let i = 0; i < surfacePoints.length; i++) {
                const pt = surfacePoints[i];
                const color = colors[i];

                // Draw point marker
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = thinLine;

                // Outer circle
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, markerRadius, 0, Math.PI * 2);
                ctx.stroke();

                // Inner dot
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, dotRadius, 0, Math.PI * 2);
                ctx.fill();

                // Label with shadow
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.fillStyle = '#000';
                ctx.fillText(labels[i], pt.x + markerRadius + 4, pt.y + fontSize/3);
                ctx.fillStyle = color;
                ctx.fillText(labels[i], pt.x + markerRadius + 3, pt.y + fontSize/3 - 1);
            }

            // Draw lines connecting points if 2+
            if (surfacePoints.length >= 2) {
                ctx.strokeStyle = 'rgba(255,255,0,0.7)';
                ctx.lineWidth = thinLine;
                ctx.setLineDash([dashSize, dashSize]);
                ctx.beginPath();
                ctx.moveTo(surfacePoints[0].x, surfacePoints[0].y);
                for (let i = 1; i < surfacePoints.length; i++) {
                    ctx.lineTo(surfacePoints[i].x, surfacePoints[i].y);
                }
                if (surfacePoints.length >= 3) {
                    ctx.lineTo(surfacePoints[0].x, surfacePoints[0].y);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw surface normal vector from center
            const cx = surfacePoints.reduce((s, p) => s + p.x, 0) / surfacePoints.length;
            const cy = surfacePoints.reduce((s, p) => s + p.y, 0) / surfacePoints.length;

            const arrowLen = Math.max(30, 50 * scale);
            const arrowHead = Math.max(8, 12 * scale);

            if (surfacePlane.gradientMag > 0.001) {
                const nx = -dzdx / surfacePlane.gradientMag;
                const ny = -dzdy / surfacePlane.gradientMag;

                const ex = cx + nx * arrowLen;
                const ey = cy + ny * arrowLen;

                // Debug: log the computed values
                console.log(`Arrow: center=(${cx.toFixed(0)}, ${cy.toFixed(0)}), end=(${ex.toFixed(0)}, ${ey.toFixed(0)}), nx=${nx.toFixed(3)}, ny=${ny.toFixed(3)}`);

                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = lineWidth * 1.5;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(ex, ey);
                ctx.stroke();

                const angle = Math.atan2(ny, nx);
                ctx.beginPath();
                ctx.moveTo(ex, ey);
                ctx.lineTo(ex - arrowHead * Math.cos(angle - 0.4), ey - arrowHead * Math.sin(angle - 0.4));
                ctx.lineTo(ex - arrowHead * Math.cos(angle + 0.4), ey - arrowHead * Math.sin(angle + 0.4));
                ctx.closePath();
                ctx.fillStyle = '#00ffff';
                ctx.fill();

                // Draw center dot
                ctx.beginPath();
                ctx.arc(cx, cy, dotRadius * 2, 0, Math.PI * 2);
                ctx.fill();

                // Debug label showing direction
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.fillStyle = '#000';
                ctx.fillText(`nx=${nx.toFixed(2)} ny=${ny.toFixed(2)}`, cx + 5, cy - 10);
                ctx.fillStyle = '#00ffff';
                ctx.fillText(`nx=${nx.toFixed(2)} ny=${ny.toFixed(2)}`, cx + 4, cy - 11);
            } else {
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = lineWidth;
                ctx.beginPath();
                ctx.arc(cx, cy, arrowLen * 0.4, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy, dotRadius * 2, 0, Math.PI * 2);
                ctx.fillStyle = '#00ffff';
                ctx.fill();
            }

            // Update HTML debug info (only when requested)
            if (showInfoBox) {
                updateSurfaceDebugInfo();
            }
        }

        function updateSurfaceDebugInfo() {
            const debugEl = document.getElementById('surfaceDebugInfo');
            if (!debugEl) return;

            if (!surfacePlane || surfacePoints.length === 0) {
                debugEl.style.display = 'none';
                return;
            }

            debugEl.style.display = 'block';
            const { depthTransform, orientation } = surfacePlane;
            const dzdx = surfacePlane.dzdx || 0;
            const dzdy = surfacePlane.dzdy || 0;
            const c = surfacePlane.c || 0;
            const tolerance = parseInt(document.getElementById('surfaceTolerance').value);

            let text = `=== Surface Debug ===\n`;
            text += `Reference Points: ${surfacePoints.length}/4 (dbl-click to reset)\n`;
            text += `Transform: ${depthTransform.toUpperCase()}\n\n`;

            if (depthTransform === 'quadratic') {
                const { a, b, c: cq, d, e, f } = surfacePlane;
                text += `Surface: z = ${a.toFixed(6)}*x² + ${b.toFixed(6)}*y² + ${cq.toFixed(6)}*xy\n`;
                text += `            + ${d.toFixed(4)}*x + ${e.toFixed(4)}*y + ${f.toFixed(2)}\n`;
            } else if (depthTransform === 'bilinear') {
                const { a, b, c: cb, d } = surfacePlane;
                text += `Surface: z = ${a.toFixed(2)} + ${b.toFixed(4)}*x + ${cb.toFixed(4)}*y + ${d.toFixed(6)}*xy\n`;
                text += `(Exact fit through reference points)\n`;
            } else if (depthTransform === 'inverse') {
                text += `Plane equation: 1/z = ${dzdx.toFixed(8)} * x + ${dzdy.toFixed(8)} * y + ${c.toFixed(6)}\n`;
            } else if (depthTransform === 'log') {
                text += `Plane equation: log(z) = ${dzdx.toFixed(6)} * x + ${dzdy.toFixed(6)} * y + ${c.toFixed(2)}\n`;
            } else {
                text += `Plane equation: z = ${dzdx.toFixed(6)} * x + ${dzdy.toFixed(6)} * y + ${c.toFixed(2)}\n`;
            }
            text += `Orientation: ${orientation}\n`;
            text += `Depth tolerance: ${tolerance}\n`;

            // Show gradient info for normal vector
            text += `\nSurface Gradient (at center):\n`;
            text += `  dz/dx = ${dzdx.toFixed(6)} (depth change per pixel right)\n`;
            text += `  dz/dy = ${dzdy.toFixed(6)} (depth change per pixel down)\n`;
            text += `  |gradient| = ${surfacePlane.gradientMag.toFixed(6)}\n`;
            text += `  (Depth encoding: 0=near, 255=far)\n`;
            text += `  Arrow points toward CLOSER direction\n`;

            text += `\nReference Points:\n`;

            for (let i = 0; i < surfacePoints.length; i++) {
                const pt = surfacePoints[i];
                let expectedZ, diff;

                if (depthTransform === 'quadratic') {
                    const { a, b, c: cq, d, e, f } = surfacePlane;
                    expectedZ = a*pt.x*pt.x + b*pt.y*pt.y + cq*pt.x*pt.y + d*pt.x + e*pt.y + f;
                    diff = pt.z - expectedZ;
                } else if (depthTransform === 'bilinear') {
                    const { a, b, c: cb, d } = surfacePlane;
                    expectedZ = a + b*pt.x + cb*pt.y + d*pt.x*pt.y;
                    diff = pt.z - expectedZ;
                } else {
                    const fitValue = dzdx * pt.x + dzdy * pt.y + c;
                    if (depthTransform === 'inverse' && pt.z > 0 && fitValue > 0) {
                        expectedZ = 1.0 / fitValue;
                        diff = pt.z - expectedZ;
                    } else if (depthTransform === 'log' && pt.z > 0) {
                        expectedZ = Math.exp(fitValue);
                        diff = pt.z - expectedZ;
                    } else {
                        expectedZ = fitValue;
                        diff = pt.z - expectedZ;
                    }
                }
                const inPlaneTol = Math.abs(diff) <= tolerance;
                const status = inPlaneTol ? '✓' : '✗';

                text += `  P${i+1}: x=${pt.x}, y=${pt.y}, depth=${pt.z}`;
                if (depthTransform === 'inverse') {
                    text += ` (1/z=${(1/pt.z).toFixed(6)})`;
                }
                text += `\n`;
                text += `      expected=${expectedZ.toFixed(2)}, diff=${diff.toFixed(2)} ${status}\n`;
            }

            // Test points section
            if (testPointsIn.length > 0 || testPointsOut.length > 0) {
                text += `\n=== Test Points (shift+click to add) ===\n`;
                text += `Shift+LeftClick = IN points (used for fitting)\n`;
                text += `Shift+RightClick = OUT points (for testing)\n`;
                text += `Normal click resets all test points\n\n`;

                if (testPointsIn.length > 0) {
                    text += `IN POINTS - used for surface fitting (${testPointsIn.length}):\n`;
                    for (const pt of testPointsIn) {
                        text += `  (${pt.x}, ${pt.y}, ${pt.z})\n`;
                    }
                }
                if (testPointsOut.length > 0) {
                    text += `OUT POINTS - for testing only (${testPointsOut.length}):\n`;
                    for (const pt of testPointsOut) {
                        text += `  (${pt.x}, ${pt.y}, ${pt.z})\n`;
                    }
                }
            }

            debugEl.textContent = text;
        }

        function renderDepthView() {
            const canvas = document.getElementById('depthCanvas');
            if (!canvas || !depthData) return;

            const ctx = canvas.getContext('2d');
            const originalCanvas = document.getElementById('originalCanvas');
            const originalCtx = originalCanvas ? originalCanvas.getContext('2d') : null;
            const view = document.querySelector('input[name="depthView"]:checked')?.value || 'depth';

            // Always redraw original canvas with visualization (show vector in ALL modes)
            if (originalCtx && depthOriginalImage) {
                originalCtx.drawImage(depthOriginalImage, 0, 0);
                if (surfacePlane && surfacePoints.length > 0) {
                    drawSurfaceVisualization(originalCtx, originalCanvas.width, originalCanvas.height, false);
                }
            }

            if (view === 'original' && depthOriginalImage) {
                ctx.drawImage(depthOriginalImage, 0, 0, canvas.width, canvas.height);
                // Draw surface visualization in original mode too (show vector always)
                if (surfacePlane && surfacePoints.length > 0) {
                    drawSurfaceVisualization(ctx, canvas.width, canvas.height, false);
                }
            } else if (view === 'selection' && depthOriginalData) {
                // Draw checkerboard background first
                drawCheckerboard(ctx, canvas.width, canvas.height);

                // Apply mask with alpha based on depth range
                const imageData = ctx.createImageData(canvas.width, canvas.height);
                const pixels = imageData.data;

                for (let i = 0; i < depthData.data.length; i += 4) {
                    const depthVal = depthData.data[i];
                    if (depthVal >= depthRangeMin && depthVal <= depthRangeMax) {
                        pixels[i] = depthOriginalData.data[i];
                        pixels[i + 1] = depthOriginalData.data[i + 1];
                        pixels[i + 2] = depthOriginalData.data[i + 2];
                        pixels[i + 3] = 255;
                    }
                }

                // Draw image with alpha onto checkerboard
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.putImageData(imageData, 0, 0);
                ctx.drawImage(tempCanvas, 0, 0);
                // Draw surface visualization in selection mode too (show vector always)
                if (surfacePlane && surfacePoints.length > 0) {
                    drawSurfaceVisualization(ctx, canvas.width, canvas.height, false);
                }
            } else if (view === 'surface' && depthOriginalData) {
                // Draw checkerboard background
                drawCheckerboard(ctx, canvas.width, canvas.height);

                if (surfacePlane && surfacePoints.length > 0) {
                    // Apply surface plane mask
                    const imageData = ctx.createImageData(canvas.width, canvas.height);
                    const pixels = imageData.data;
                    const { depthTransform } = surfacePlane;
                    const dzdx = surfacePlane.dzdx || 0;
                    const dzdy = surfacePlane.dzdy || 0;
                    const c = surfacePlane.c || 0;
                    const gradientMag = surfacePlane.gradientMag || 0;
                    const tolerance = parseInt(document.getElementById('surfaceTolerance').value);
                    const w = canvas.width;
                    const h = canvas.height;

                    // Polygon constraint
                    const usePolygonConstraint = document.getElementById('polygonConstraint')?.checked;
                    const polygon = usePolygonConstraint && surfacePoints.length >= 3 ?
                        getConvexHull(surfacePoints) : null;

                    // Normal exclusion settings
                    const useNormalExclusion = document.getElementById('normalExclusion').checked;
                    const normalToleranceDeg = parseInt(document.getElementById('normalTolerance').value);
                    const normalToleranceRad = normalToleranceDeg * Math.PI / 180;
                    const cosThreshold = Math.cos(normalToleranceRad);

                    // Reference normal vector (normalized): (-dzdx, -dzdy, 1) / length
                    // For comparison we use the gradient components directly
                    const refLen = Math.sqrt(dzdx * dzdx + dzdy * dzdy + 1);
                    const refNx = -dzdx / refLen;
                    const refNy = -dzdy / refLen;
                    const refNz = 1 / refLen;

                    for (let py = 0; py < h; py++) {
                        for (let px = 0; px < w; px++) {
                            const i = (py * w + px) * 4;
                            const actualZ = depthData.data[i];

                            // Expected depth based on surface equation and transform
                            let expectedZ, diff;

                            if (depthTransform === 'quadratic') {
                                // z = a*x² + b*y² + c*xy + d*x + e*y + f
                                const { a, b, c: cq, d, e, f } = surfacePlane;
                                expectedZ = a*px*px + b*py*py + cq*px*py + d*px + e*py + f;
                                diff = Math.abs(actualZ - expectedZ);
                            } else if (depthTransform === 'bilinear') {
                                // z = a + b*x + c*y + d*xy
                                const { a, b, c: cb, d } = surfacePlane;
                                expectedZ = a + b*px + cb*py + d*px*py;
                                diff = Math.abs(actualZ - expectedZ);
                            } else {
                                const fitValue = dzdx * px + dzdy * py + c;

                                if (depthTransform === 'inverse' && actualZ > 0 && fitValue > 0) {
                                    expectedZ = 1.0 / fitValue;
                                    diff = Math.abs(actualZ - expectedZ);
                                } else if (depthTransform === 'log' && actualZ > 0) {
                                    expectedZ = Math.exp(fitValue);
                                    diff = Math.abs(actualZ - expectedZ);
                                } else {
                                    expectedZ = fitValue;
                                    diff = Math.abs(actualZ - expectedZ);
                                }
                            }

                            if (diff <= tolerance) {
                                let include = true;

                                // Polygon constraint check
                                if (polygon && !pointInPolygon(px, py, polygon)) {
                                    include = false;
                                }

                                // Normal exclusion check
                                if (useNormalExclusion && px > 4 && px < w - 5 && py > 4 && py < h - 5) {
                                    // Compute local gradient from 9x9 neighborhood (using +/-4 pixels)
                                    const zL = depthData.data[(py * w + px - 4) * 4];
                                    const zR = depthData.data[(py * w + px + 4) * 4];
                                    const zT = depthData.data[((py - 4) * w + px) * 4];
                                    const zB = depthData.data[((py + 4) * w + px) * 4];

                                    const localDzdx = (zR - zL) / 8;  // Divide by 2*4 = 8
                                    const localDzdy = (zB - zT) / 8;

                                    // Local normal: (-localDzdx, -localDzdy, 1) normalized
                                    const localLen = Math.sqrt(localDzdx * localDzdx + localDzdy * localDzdy + 1);
                                    const localNx = -localDzdx / localLen;
                                    const localNy = -localDzdy / localLen;
                                    const localNz = 1 / localLen;

                                    // Dot product = cos(angle between normals)
                                    const dot = refNx * localNx + refNy * localNy + refNz * localNz;

                                    if (dot < cosThreshold) {
                                        include = false;
                                    }
                                }

                                if (include) {
                                    pixels[i] = depthOriginalData.data[i];
                                    pixels[i + 1] = depthOriginalData.data[i + 1];
                                    pixels[i + 2] = depthOriginalData.data[i + 2];
                                    pixels[i + 3] = 255;
                                }
                            }
                        }
                    }

                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = canvas.width;
                    tempCanvas.height = canvas.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.putImageData(imageData, 0, 0);
                    ctx.drawImage(tempCanvas, 0, 0);

                    // Draw polygon boundary if enabled
                    if (polygon && polygon.length >= 3) {
                        ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
                        ctx.lineWidth = Math.max(1, canvas.width / 500);
                        ctx.setLineDash([]);
                        ctx.beginPath();
                        ctx.moveTo(polygon[0].x, polygon[0].y);
                        for (let i = 1; i < polygon.length; i++) {
                            ctx.lineTo(polygon[i].x, polygon[i].y);
                        }
                        ctx.closePath();
                        ctx.stroke();
                    }

                    // Draw visualization on depth canvas (with info box)
                    drawSurfaceVisualization(ctx, canvas.width, canvas.height, true);
                } else {
                    // Show hint message
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, canvas.height/2 - 30, canvas.width, 60);
                    ctx.fillStyle = '#00d9ff';
                    ctx.font = '16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('Click on surface to add reference points (up to 4)', canvas.width/2, canvas.height/2 + 6);
                }
            } else {
                // Show depth map
                ctx.putImageData(depthData, 0, 0);
                // Draw surface visualization in depth mode too (show vector always)
                if (surfacePlane && surfacePoints.length > 0) {
                    drawSurfaceVisualization(ctx, canvas.width, canvas.height, false);
                }
            }
        }

        function pointInPolygon(x, y, polygon) {
            // Ray casting algorithm
            if (polygon.length < 3) return true; // Not enough points for polygon
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i].x, yi = polygon[i].y;
                const xj = polygon[j].x, yj = polygon[j].y;
                if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
                    inside = !inside;
                }
            }
            return inside;
        }

        function getConvexHull(points) {
            // Graham scan for convex hull
            if (points.length < 3) return points;

            // Find lowest point
            let start = 0;
            for (let i = 1; i < points.length; i++) {
                if (points[i].y > points[start].y ||
                    (points[i].y === points[start].y && points[i].x < points[start].x)) {
                    start = i;
                }
            }

            const pivot = points[start];
            const sorted = points.slice().sort((a, b) => {
                const angleA = Math.atan2(a.y - pivot.y, a.x - pivot.x);
                const angleB = Math.atan2(b.y - pivot.y, b.x - pivot.x);
                return angleA - angleB;
            });

            const hull = [];
            for (const p of sorted) {
                while (hull.length >= 2) {
                    const a = hull[hull.length - 2];
                    const b = hull[hull.length - 1];
                    const cross = (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x);
                    if (cross <= 0) hull.pop();
                    else break;
                }
                hull.push(p);
            }
            return hull;
        }

        function drawCheckerboard(ctx, width, height) {
            const checkSize = 10;
            for (let y = 0; y < height; y += checkSize) {
                for (let x = 0; x < width; x += checkSize) {
                    const isLight = ((x / checkSize) + (y / checkSize)) % 2 === 0;
                    ctx.fillStyle = isLight ? '#a0a0a0' : '#606060';
                    ctx.fillRect(x, y, checkSize, checkSize);
                }
            }
        }

        function getPointLabels() {
            if (surfacePoints.length === 0) return [];
            if (surfacePoints.length === 1) return ['P1'];

            // Calculate centroid
            const cx = surfacePoints.reduce((s, p) => s + p.x, 0) / surfacePoints.length;
            const cy = surfacePoints.reduce((s, p) => s + p.y, 0) / surfacePoints.length;
            const cz = surfacePoints.reduce((s, p) => s + p.z, 0) / surfacePoints.length;

            // Label each point based on relative position
            return surfacePoints.map((pt, i) => {
                const dx = pt.x - cx;
                const dy = pt.y - cy;
                const dz = pt.z - cz;

                // Determine horizontal position
                let h = dx > 20 ? 'R' : dx < -20 ? 'L' : '';
                // Determine vertical position (in image space, y increases downward)
                let v = dy > 20 ? 'Bot' : dy < -20 ? 'Top' : '';
                // Determine depth position (higher value = closer in depth maps)
                let d = dz > 10 ? 'Near' : dz < -10 ? 'Far' : '';

                if (!h && !v && !d) return `P${i + 1}`;

                // Combine labels sensibly
                if (d && (h || v)) {
                    return d + (v ? '-' + v : '') + (h ? '-' + h : '');
                }
                return (v || '') + (v && h ? '-' : '') + (h || '') + (d ? ' ' + d : '') || `P${i + 1}`;
            });
        }

            const slider = document.getElementById('depthRangeSlider');

            const maxHandle = document.getElementById('rangeMax');

            function updateSliderUI() {
                const minPercent = (depthRangeMin / 255) * 100;
                const maxPercent = (depthRangeMax / 255) * 100;
                minHandle.style.left = minPercent + '%';
                maxHandle.style.left = maxPercent + '%';
                selected.style.left = minPercent + '%';
                selected.style.width = (maxPercent - minPercent) + '%';
                document.getElementById('depthRangeDisplay').textContent = `${depthRangeMin}-${depthRangeMax}`;
            }

            function handleDrag(handle, isMin) {
                return (e) => {
                    e.preventDefault();
                    const rect = slider.getBoundingClientRect();

                    const onMove = (e) => {
                        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                        let percent = (clientX - rect.left) / rect.width;
                        percent = Math.max(0, Math.min(1, percent));
                        const value = Math.round(percent * 255);

                        if (isMin) {
                            depthRangeMin = Math.min(value, depthRangeMax - 1);
                        } else {
                            depthRangeMax = Math.max(value, depthRangeMin + 1);
                        }
                        updateSliderUI();
                        if (depthData && selectedModel && selectedModel.startsWith('depth')) {
                            renderDepthView();
                        }
                    };

                    const onUp = () => {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                        document.removeEventListener('touchmove', onMove);
                        document.removeEventListener('touchend', onUp);
                    };

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                    document.addEventListener('touchmove', onMove);
                    document.addEventListener('touchend', onUp);
                };
            }

            minHandle.addEventListener('mousedown', handleDrag(minHandle, true));
            minHandle.addEventListener('touchstart', handleDrag(minHandle, true));
            maxHandle.addEventListener('mousedown', handleDrag(maxHandle, false));
            maxHandle.addEventListener('touchstart', handleDrag(maxHandle, false));

            updateSliderUI();

        async function openCamera() {
            // Check if camera API is available
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Camera API not available. Make sure you are using HTTPS (https://localhost:8443)');
                return;
            }

            // First request permission before opening modal
            try {
                // Request camera permission (needed to get camera labels)
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true
                });
                // Permission granted - stop this test stream
                stream.getTracks().forEach(track => track.stop());

                // Enumerate cameras now that we have permission
                await enumerateCameras();

                // Now open modal and start proper stream
                cameraModal.classList.add('open');
                await startCameraStream();
            } catch (err) {
                console.error('Camera error:', err);
                if (err.name === 'NotAllowedError') {
                    alert('Camera permission denied. Please allow camera access in your browser settings.');
                } else if (err.name === 'NotFoundError') {
                    alert('No camera found on this device.');
                } else if (err.name === 'NotReadableError') {
                    alert('Camera is already in use by another application.');
                } else if (err.name === 'SecurityError') {
                    alert('Camera access requires HTTPS. Please use https://localhost:8443');
                } else {
                    alert('Camera error: ' + err.message);
                }
            }
        }

        async function startCameraStream() {
            // Stop existing stream if any
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());

            const constraints = {
                video: {

                    height: { ideal: 720 }
                }
            };

            // Use specific device if selected
            if (selectedDeviceId) {
                constraints.video.deviceId = { exact: selectedDeviceId };

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                cameraVideo.srcObject = cameraStream;

                console.error('Stream error:', err);

            try {
                const formData = new FormData();

                const isCaption = selectedModel.startsWith('caption');

                if (isCaption) {
                    endpoint = `/inference/${selectedModel}/caption`;
                } else if (isDetect) {
                    endpoint = `/inference/${selectedModel}/detect`;
                } else if (isPose) {
                    endpoint = `/inference/${selectedModel}/pose`;
                } else if (isHand) {
                    endpoint = `/inference/${selectedModel}/hands`;
                }

                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || 'Inference failed');
                }

                // Display result based on model type
                if (isPose) {
                    renderPoseResult(result, blob);
                } else if (isHand) {
                    renderHandResult(result, blob);
                } else if (isCaption) {
                    renderCaptionResult(result);
                } else if (isDetect) {
                    renderDetectResult(result, blob);
                } else {
                    // Default mask display for other models
                    renderMaskResult(result, blob);
                }

            } catch (err) {
                console.error('Inference error:', err);
                if (!isLiveMode) {
                    alert('Error: ' + err.message);
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Run Inference';
            }
        }

        function renderPoseResult(result, blob) {
            const imageUrl = URL.createObjectURL(blob);
            const resultsDiv = document.getElementById('results');

            resultsDiv.innerHTML = `
                <div class="result-panel">
                    <h3>Camera Input</h3>
                    <div class="result-image">
                        <img src="${imageUrl}" alt="Camera" id="poseOriginal">
                        <canvas id="poseOverlay" style="position:absolute;top:0;left:0;pointer-events:none;"></canvas>
                    </div>
                </div>
                <div class="result-panel">
                    <h3>Pose Detection</h3>
                    <div class="result-info">
                        <p><strong>Poses found:</strong> ${result.count}</p>
                        <p><strong>Processing:</strong> ${result.processing_time_ms?.toFixed(1) || 0}ms</p>
                        ${result.poses?.map((p, i) => `<p>Pose ${i+1}: ${p.keypoints?.length || 0} keypoints, score: ${(p.score || 0).toFixed(2)}</p>`).join('') || ''}
                    </div>
                </div>
            `;

            // Draw pose overlay
            const img = document.getElementById('poseOriginal');
            img.onload = () => {
                const canvas = document.getElementById('poseOverlay');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');

                // Draw keypoints and skeleton for each pose
                const colors = ['#00ff88', '#ff6b6b', '#00d9ff', '#ffd700', '#ff69b4'];
                result.poses?.forEach((pose, poseIdx) => {
                    const color = colors[poseIdx % colors.length];
                    const keypoints = pose.keypoints || [];

                    // Draw skeleton connections
                    const skeleton = [
                        [11, 12], [11, 13], [13, 15], [12, 14], [14, 16], // torso + legs
                        [11, 23], [12, 24], [23, 24], [23, 25], [24, 26], [25, 27], [26, 28], // hips + legs
                        [0, 1], [0, 4], [1, 2], [2, 3], [4, 5], [5, 6] // face
                    ];

                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    skeleton.forEach(([i, j]) => {
                        const kp1 = keypoints[i];
                        const kp2 = keypoints[j];
                        if (kp1 && kp2 && (kp1.confidence || 0) > 0.3 && (kp2.confidence || 0) > 0.3) {
                            const scaleX = img.width / img.naturalWidth;
                            const scaleY = img.height / img.naturalHeight;
                            ctx.beginPath();
                            ctx.moveTo(kp1.x * scaleX, kp1.y * scaleY);
                            ctx.lineTo(kp2.x * scaleX, kp2.y * scaleY);
                            ctx.stroke();
                        }
                    });

                    // Draw keypoints
                    ctx.fillStyle = color;
                    keypoints.forEach(kp => {
                        if ((kp.confidence || 0) > 0.3) {
                            const scaleX = img.width / img.naturalWidth;
                            const scaleY = img.height / img.naturalHeight;
                            ctx.beginPath();
                            ctx.arc(kp.x * scaleX, kp.y * scaleY, 4, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });
                });
            };
        }

        function renderHandResult(result, blob) {
            const imageUrl = URL.createObjectURL(blob);
            const resultsDiv = document.getElementById('results');

            resultsDiv.innerHTML = `
                <div class="result-panel">
                    <h3>Camera Input</h3>
                    <div class="result-image">
                        <img src="${imageUrl}" alt="Camera" id="handOriginal">
                        <canvas id="handOverlay" style="position:absolute;top:0;left:0;pointer-events:none;"></canvas>
                    </div>
                </div>
                <div class="result-panel">
                    <h3>Hand Detection</h3>
                    <div class="result-info">
                        <p><strong>Hands found:</strong> ${result.count}</p>
                        <p><strong>Processing:</strong> ${result.processing_time_ms?.toFixed(1) || 0}ms</p>
                        ${result.hands?.map((h, i) => `<p>Hand ${i+1}: ${h.handedness}, ${h.landmarks?.length || 0} landmarks</p>`).join('') || ''}
                    </div>
                </div>
            `;

            // Draw hand overlay
            const img = document.getElementById('handOriginal');
            img.onload = () => {
                const canvas = document.getElementById('handOverlay');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');

                const colors = { left: '#00ff88', right: '#ff6b6b', unknown: '#00d9ff' };
                const skeleton = result.skeleton || [
                    [0,1],[1,2],[2,3],[3,4], // thumb
                    [0,5],[5,6],[6,7],[7,8], // index
                    [0,9],[9,10],[10,11],[11,12], // middle
                    [0,13],[13,14],[14,15],[15,16], // ring
                    [0,17],[17,18],[18,19],[19,20], // pinky
                    [5,9],[9,13],[13,17] // palm
                ];

                result.hands?.forEach(hand => {
                    const color = colors[hand.handedness] || colors.unknown;
                    const landmarks = hand.landmarks || [];
                    const scaleX = img.width / img.naturalWidth;
                    const scaleY = img.height / img.naturalHeight;

                    // Draw skeleton
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    skeleton.forEach(([i, j]) => {
                        const lm1 = landmarks[i];
                        const lm2 = landmarks[j];
                        if (lm1 && lm2) {
                            ctx.beginPath();
                            ctx.moveTo(lm1.x * scaleX, lm1.y * scaleY);
                            ctx.lineTo(lm2.x * scaleX, lm2.y * scaleY);
                            ctx.stroke();
                        }
                    });

                    // Draw landmarks
                    ctx.fillStyle = color;
                    landmarks.forEach(lm => {
                        ctx.beginPath();
                        ctx.arc(lm.x * scaleX, lm.y * scaleY, 3, 0, Math.PI * 2);
                        ctx.fill();
                    });
                });
            };
        }

        function renderMaskResult(result, blob) {
            const imageUrl = URL.createObjectURL(blob);
            const resultsDiv = document.getElementById('results');

            if (result.mask) {
                resultsDiv.innerHTML = `
                    <div class="result-panel">
                        <h3>Camera Input</h3>
                        <div class="result-image">
                            <img src="${imageUrl}" alt="Camera">
                        </div>
                    </div>
                    <div class="result-panel">
                        <h3>Result Mask</h3>
                        <div class="result-image">
                            <img src="data:image/png;base64,${result.mask.data}" alt="Mask">
                        </div>
                        <div class="result-info">
                            <p><strong>Processing:</strong> ${result.processing_time_ms?.toFixed(1) || 0}ms</p>
                        </div>
                    </div>
                `;
            } else {
                resultsDiv.innerHTML = `
                    <div class="result-panel">
                        <h3>Camera Input</h3>
                        <div class="result-image">
                            <img src="${imageUrl}" alt="Camera">
                        </div>
                    </div>
                    <div class="result-panel">
                        <h3>Result</h3>
                        <div class="result-info">
                            <p><strong>Processing:</strong> ${result.processing_time_ms?.toFixed(1) || 0}ms</p>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        </div>
                    </div>
                `;
            }
        }

        // Override runInference to handle camera blob
        const originalUpdateRunButton = updateRunButton;
        updateRunButton = function() {
            const btn = document.getElementById('runBtn');
            btn.disabled = !selectedModel || (!selectedImage && !cameraBlob);
        };

        // Modify the run button click to handle camera captures
        document.getElementById('runBtn').addEventListener('click', async function(e) {
            if (cameraBlob && !selectedImage) {
                e.stopImmediatePropagation();
                await runInferenceWithBlob(cameraBlob);
            }
        }, true);

    </script>

    <!-- Camera Modal -->
    <div class="camera-modal" id="cameraModal">
        <div class="camera-container">
            <video class="camera-video" id="cameraVideo" playsinline autoplay muted></video>
            <canvas class="camera-canvas" id="cameraCanvas"></canvas>
        </div>
        <div class="camera-controls">
            <select id="cameraSelect" style="padding:8px 12px; background:#333; color:#fff; border:1px solid #555; border-radius:5px; font-size:14px; min-width:200px;">
                <option value="">Loading cameras...</option>
            </select>
            <button class="camera-capture-btn" onclick="capturePhoto()" title="Capture"></button>
            <button class="camera-close-btn" onclick="closeCamera()">Close</button>
        </div>
        <div class="live-toggle">
            <input type="checkbox" id="liveModeToggle" onchange="toggleLiveMode(this.checked)">
            <label for="liveModeToggle">Live Mode (continuous processing)</label>
        </div>
    </div>
</body>
</html>
