<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModelStag Test</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 20px;
        }
        .container.controls-container {
            max-width: 1200px;
        }
        h1 { color: #00d9ff; margin-bottom: 20px; }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-group label {
            color: #00d9ff;
            font-size: 13px;
            text-transform: uppercase;
            font-weight: 600;
        }
        select {
            padding: 8px 12px;
            border: 2px solid #0f3460;
            background: #0f3460;
            color: #eee;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            min-width: 180px;
        }
        select:hover { background: #1a4a7a; }
        select:focus { border-color: #00d9ff; outline: none; }
        .image-picker {
            position: relative;
        }
        .camera-btn {
            padding: 8px 12px;
            border: 2px solid #0f3460;
            background: #0f3460;
            color: #eee;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .camera-btn:hover { background: #1a4a7a; }
        .camera-btn.active {
            border-color: #00ff88;
            background: #00ff8830;
        }
        .camera-btn.live {
            border-color: #ff6b6b;
            background: #ff6b6b30;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .camera-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }
        .camera-modal.open {
            display: flex;
        }
        .camera-container {
            position: relative;
            max-width: 90vw;
            max-height: 70vh;
        }
        .camera-video {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 10px;
            background: #000;
        }
        .camera-canvas {
            display: none;
        }
        .camera-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .camera-capture-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .camera-capture-btn:hover {
            transform: scale(1.1);
        }
        .camera-capture-btn::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            background: #ff4444;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .camera-capture-btn:hover::after {
            background: #ff6666;
        }
        .camera-close-btn {
            padding: 10px 25px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .camera-close-btn:hover {
            background: #444;
        }
        .camera-switch-btn {
            padding: 10px 15px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .camera-switch-btn:hover {
            background: #444;
        }
        .live-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 14px;
        }
        .live-toggle input {
            width: 18px;
            height: 18px;
            accent-color: #ff6b6b;
        }
        .live-indicator {
            display: none;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #ff6b6b;
            margin-left: 10px;
        }
        .live-indicator.active {
            display: flex;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff6b6b;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        .image-picker-btn {
            padding: 8px 12px;
            border: 2px solid #0f3460;
            background: #0f3460;
            color: #eee;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            min-width: 180px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .image-picker-btn:hover { background: #1a4a7a; }
        .image-picker-btn.active { border-color: #00d9ff; }
        .image-picker-btn img {
            width: 24px;
            height: 24px;
            object-fit: cover;
            border-radius: 3px;
        }
        .image-picker-btn .arrow {
            margin-left: auto;
        }
        .image-grid {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            padding: 10px;
            z-index: 100;
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            min-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .image-grid.open {
            display: grid;
        }
        .image-grid-item {
            cursor: pointer;
            border-radius: 5px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.15s;
        }
        .image-grid-item:hover {
            border-color: #00d9ff;
            transform: scale(1.05);
        }
        .image-grid-item.selected {
            border-color: #00d9ff;
        }
        .image-grid-item img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            display: block;
        }
        .status-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 5px;
        }
        .status-badge.running { background: #00ff8820; color: #00ff88; }
        .status-badge.starting { background: #ffd70020; color: #ffd700; }
        .status-badge.stopped { background: #88888820; color: #888; }
        .run-btn {
            padding: 10px 30px;
            font-size: 16px;
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .run-btn:hover { background: #00b8d9; }
        .run-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .sam-modes {
            display: flex;
            gap: 10px;
            margin-left: 10px;
        }
        .sam-modes label, .depth-controls label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #aaa;
            cursor: pointer;
        }
        .sam-modes input[type="radio"], .depth-controls input[type="radio"] {
            accent-color: #00d9ff;
        }
        .depth-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .range-slider {
            position: relative;
            width: 150px;
            height: 24px;
            margin: 0 10px;
            user-select: none;
        }
        .range-track {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 6px;
            background: #0f3460;
            border-radius: 3px;
        }
        .range-selected {
            position: absolute;
            height: 100%;
            background: #00d9ff;
            border-radius: 3px;
        }
        .range-handle {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border: 2px solid #00d9ff;
            border-radius: 50%;
            cursor: grab;
            z-index: 2;
        }
        .range-handle:hover {
            transform: translate(-50%, -50%) scale(1.2);
        }
        .range-handle:active {
            cursor: grabbing;
        }
        .range-handle.range-min {
            border-color: #ff6b6b;
        }
        .depth-range-label {
            font-size: 12px;
            color: #888;
            margin-left: 10px;
        }
        .depth-value-display {
            font-size: 11px;
            color: #00d9ff;
            margin-left: 5px;
        }
        .depth-click-hint {
            font-size: 11px;
            color: #666;
            text-align: center;
            padding: 5px;
        }
        .preview {
            display: none;
        }
        .placeholder-content {
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f3460;
            color: #666;
        }
        .placeholder-text {
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .result-card {
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
        }
        .result-card h3 {
            margin: 0;
            padding: 12px 15px;
            background: #0f3460;
            color: #00d9ff;
            font-size: 14px;
        }
        .result-card img, .result-card canvas {
            width: 100%;
            display: block;
        }
        .result-info {
            padding: 10px 15px;
            font-size: 12px;
            color: #aaa;
        }
        .checkerboard {
            background-image:
                linear-gradient(45deg, #808080 25%, transparent 25%),
                linear-gradient(-45deg, #808080 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #808080 75%),
                linear-gradient(-45deg, transparent 75%, #808080 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #a0a0a0;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #333;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .refresh-btn {
            background: none;
            border: 1px solid #444;
            color: #888;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .refresh-btn:hover { border-color: #00d9ff; color: #00d9ff; }
        .error-msg {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 5px;
        }
        .mask-info {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 100;
            display: none;
        }
        .canvas-container {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container controls-container">
        <h1>ModelStag Test</h1>

        <div class="controls">
            <div class="control-group">
                <label>Model</label>
                <select id="modelSelect">
                    <option value="">Loading...</option>
                </select>
                <button class="refresh-btn" onclick="loadModels()">↻</button>
            </div>
            <div class="control-group">
                <label>Image</label>
                <div class="image-picker">
                    <button class="image-picker-btn" id="imagePickerBtn">
                        <span id="imagePickerText">Select image...</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div class="image-grid" id="imageGrid"></div>
                </div>
                <button class="camera-btn" id="cameraBtn" title="Use camera">
                    <span>📷</span>
                    <span>Camera</span>
                </button>
                <span class="live-indicator" id="liveIndicator">
                    <span class="live-dot"></span>
                    <span>LIVE</span>
                </span>
            </div>
            <div class="control-group" id="samModesGroup" style="display: none;">
                <div class="sam-modes">
                    <label><input type="radio" name="samMode" value="filled" checked> Filled</label>
                    <label><input type="radio" name="samMode" value="outlines"> Outlines</label>
                    <label><input type="radio" name="samMode" value="cursor"> Under Cursor</label>
                </div>
            </div>
            <div class="control-group" id="depthControlsGroup" style="display: none;">
                <div class="depth-controls">
                    <label><input type="radio" name="depthView" value="depth" checked> Depth</label>
                    <label><input type="radio" name="depthView" value="original"> Original</label>
                    <label><input type="radio" name="depthView" value="selection"> Selection</label>
                    <label><input type="radio" name="depthView" value="surface"> Surface</label>
                    <span id="surfaceToleranceGroup" style="display: none;">
                        <span class="depth-range-label">Depth:</span>
                        <input type="range" id="surfaceTolerance" min="1" max="50" value="15" style="width: 60px; vertical-align: middle;">
                        <span id="surfaceToleranceDisplay" class="depth-value-display">15</span>
                        <label style="margin-left: 10px; font-size: 11px; color: #aaa;">
                            <input type="checkbox" id="polygonConstraint" style="vertical-align: middle;"> Inside polygon
                        </label>
                        <label style="margin-left: 5px; font-size: 11px; color: #aaa;">
                            <input type="checkbox" id="normalExclusion" style="vertical-align: middle;"> Normals
                        </label>
                        <span id="normalToleranceGroup" style="display: none;">
                            <input type="range" id="normalTolerance" min="5" max="90" value="30" style="width: 50px; vertical-align: middle;">
                            <span id="normalToleranceDisplay" class="depth-value-display">30°</span>
                        </span>
                        <select id="depthTransform" style="margin-left: 10px; background:#0f3460; color:#eee; border:1px solid #1a4a7a; padding:2px; font-size:11px;">
                            <option value="linear">Linear (plane)</option>
                            <option value="quadratic">Quadratic (curved)</option>
                            <option value="bilinear">Bilinear (exact 4pt)</option>
                            <option value="inverse">Inverse (1/z)</option>
                            <option value="log">Log (ln z)</option>
                        </select>
                    </span>
                    <div class="range-slider" id="depthRangeSlider" style="display: none;">
                        <div class="range-track">
                            <div class="range-selected" id="rangeSelected"></div>
                        </div>
                        <div class="range-handle range-min" id="rangeMin"></div>
                        <div class="range-handle range-max" id="rangeMax"></div>
                    </div>
                    <span id="depthRangeDisplay" class="depth-value-display" style="display: none;">0-255</span>
                </div>
            </div>
            <button class="run-btn" id="runBtn" disabled>Run Inference</button>
        </div>
    </div>

    <div class="container">
        <div class="preview" id="preview"></div>
        <div class="results" id="results"></div>
    </div>


    <script>
        let selectedModel = null;
        let selectedImage = null;
        let models = {};
        let pollInterval = null;
        let samMasksData = null;  // Store SAM masks for interactive modes
        let samMaskImages = [];   // Pre-decoded mask images
        let depthData = null;     // Store depth map data for interactive selection
        let depthOriginalImage = null;  // Store original image for depth toggle
        let depthOriginalData = null;   // Store original image pixel data
        let depthRangeMin = 0;    // Current min range value
        let depthRangeMax = 255;  // Current max range value

        // Surface selection state
        let surfacePoints = [];   // Array of {x, y, z} reference points (up to 4)
        let surfacePlane = null;  // { dzdx, dzdy, samples[] } fitted from all points
        let testPointsIn = [];    // Shift+click: points that SHOULD be included
        let testPointsOut = [];   // Shift+right-click: points that should be EXCLUDED

        // Cookie helpers
        function setCookie(name, value) {
            document.cookie = `${name}=${encodeURIComponent(value)}; path=/; max-age=86400`;
        }
        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? decodeURIComponent(match[2]) : null;
        }

        // HSL to RGB helper
        function hslToRgb(hue) {
            const s = 0.7, l = 0.5;
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs((hue / 60) % 2 - 1));
            const m = l - c / 2;
            let r, g, b;
            if (hue < 60) { r = c; g = x; b = 0; }
            else if (hue < 120) { r = x; g = c; b = 0; }
            else if (hue < 180) { r = 0; g = c; b = x; }
            else if (hue < 240) { r = 0; g = x; b = c; }
            else if (hue < 300) { r = x; g = 0; b = c; }
            else { r = c; g = 0; b = x; }
            return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
        }

        async function loadModels() {
            const select = document.getElementById('modelSelect');
            try {
                const resp = await fetch('/models');
                const data = await resp.json();
                models = {};
                data.models.forEach(m => models[m.name] = m);
                renderModels();
            } catch (e) {
                select.innerHTML = '<option value="">Failed to load</option>';
            }
        }

        function renderModels() {
            const select = document.getElementById('modelSelect');
            select.innerHTML = '<option value="">Select model...</option>';

            const anyStarting = Object.values(models).some(m => m.status === 'starting');
            if (anyStarting && !pollInterval) {
                pollInterval = setInterval(loadModels, 2000);
            } else if (!anyStarting && pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }

            Object.values(models).forEach(model => {
                const opt = document.createElement('option');
                opt.value = model.name;
                opt.textContent = `${model.name} [${model.status}]`;
                if (model.name === selectedModel) opt.selected = true;
                select.appendChild(opt);
            });
        }

        async function selectModel(name) {
            selectedModel = name;
            setCookie('modelstag_model', name);

            // Show/hide model-specific controls
            const isSam = name && name.startsWith('sam');
            const isDepth = name && name.startsWith('depth');
            document.getElementById('samModesGroup').style.display = isSam ? 'flex' : 'none';
            document.getElementById('depthControlsGroup').style.display = isDepth ? 'flex' : 'none';

            updateRunButton();
        }

        function selectImage(name) {
            selectedImage = name;
            setCookie('modelstag_image', name);
            updateRunButton();
            updateImagePickerBtn();
            renderImageGrid();

            // Show in results layout immediately
            updateResultsPreview();
        }

        function updateResultsPreview() {
            const resultsDiv = document.getElementById('results');
            const preview = document.getElementById('preview');
            preview.innerHTML = '';  // Clear old preview

            if (selectedImage) {
                resultsDiv.innerHTML = `
                    <div class="result-card">
                        <h3>Original</h3>
                        <img src="/images/${selectedImage}" alt="Original">
                    </div>
                    <div class="result-card placeholder">
                        <h3>Result</h3>
                        <div class="placeholder-content">
                            <div class="placeholder-text">Select a model and click Run Inference</div>
                        </div>
                    </div>
                `;
            } else {
                resultsDiv.innerHTML = '';
            }
        }

        function updateRunButton() {
            const btn = document.getElementById('runBtn');
            btn.disabled = !selectedModel || !selectedImage;
        }

        function getSamMode() {
            return document.querySelector('input[name="samMode"]:checked')?.value || 'filled';
        }

        async function runInference() {
            if (!selectedModel || !selectedImage) return;

            const btn = document.getElementById('runBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Processing...';

            const resultsDiv = document.getElementById('results');

            try {
                const imageResp = await fetch(`/images/${selectedImage}`);
                const imageBlob = await imageResp.blob();

                const formData = new FormData();
                formData.append('image', imageBlob, selectedImage);

                const startTime = Date.now();
                const isSam = selectedModel && selectedModel.startsWith('sam');
                const isDepth = selectedModel && selectedModel.startsWith('depth');
                const isCaption = selectedModel && selectedModel.startsWith('caption');
                const isDetect = selectedModel && selectedModel.startsWith('detect');

                let endpoint;
                if (isSam) {
                    endpoint = `/inference/${selectedModel}/all-masks`;
                } else if (isCaption) {
                    endpoint = `/inference/${selectedModel}/caption`;
                } else if (isDetect) {
                    endpoint = `/inference/${selectedModel}/detect`;
                } else {
                    endpoint = `/inference/${selectedModel}`;
                }

                const resp = await fetch(endpoint, { method: 'POST', body: formData });
                const totalTime = Date.now() - startTime;
                const data = await resp.json();

                if (isSam) {
                    samMasksData = data;
                    await renderSamResult(data, totalTime);
                } else if (isDepth) {
                    await renderDepthResult(data, totalTime);
                } else if (isCaption) {
                    renderCaptionResult(data, totalTime);
                } else if (isDetect) {
                    renderDetectResult(data, totalTime);
                } else {
                    renderRegularResult(data, totalTime);
                }
            } catch (e) {
                resultsDiv.innerHTML = `<div class="error-msg">Error: ${e.message}</div>`;
            }

            btn.disabled = false;
            btn.textContent = 'Run Inference';
            updateRunButton();
        }

        async function renderSamResult(data, totalTime) {
            const resultsDiv = document.getElementById('results');
            const mode = getSamMode();

            resultsDiv.innerHTML = `
                <div class="result-card">
                    <h3>Original</h3>
                    <img src="/images/${selectedImage}" alt="Original">
                </div>
                <div class="result-card">
                    <h3>SAM: ${data.masks_count} objects</h3>
                    <div class="canvas-container">
                        <canvas id="samCanvas"></canvas>
                        <div class="mask-info" id="maskInfo"></div>
                    </div>
                    <div class="result-info">
                        Processing: ${(data.processing_time_ms/1000).toFixed(1)}s |
                        Total: ${(totalTime/1000).toFixed(1)}s
                    </div>
                </div>
            `;

            const canvas = document.getElementById('samCanvas');
            const ctx = canvas.getContext('2d');
            const origImg = new Image();

            origImg.onload = async () => {
                canvas.width = origImg.width;
                canvas.height = origImg.height;

                // Generate colors for all masks
                const colors = data.masks.map((_, i) => hslToRgb((i * 137.5) % 360));

                // Pre-decode all mask images
                samMaskImages = [];
                for (let i = 0; i < data.masks.length; i++) {
                    const maskImg = new Image();
                    await new Promise(resolve => {
                        maskImg.onload = resolve;
                        maskImg.src = `data:image/png;base64,${data.masks[i].mask}`;
                    });

                    // Get pixel data
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = canvas.width;
                    tempCanvas.height = canvas.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.drawImage(maskImg, 0, 0, canvas.width, canvas.height);
                    const pixels = tempCtx.getImageData(0, 0, canvas.width, canvas.height).data;

                    samMaskImages.push({ pixels, color: colors[i], data: data.masks[i] });
                }

                // Render based on mode
                if (mode === 'filled') {
                    renderFilledMode(canvas, ctx, origImg);
                } else if (mode === 'outlines') {
                    renderOutlinesMode(canvas, ctx, origImg);
                } else {
                    renderCursorMode(canvas, ctx, origImg);
                }
            };
            origImg.src = `/images/${selectedImage}`;
        }

        function renderFilledMode(canvas, ctx, origImg) {
            ctx.drawImage(origImg, 0, 0);

            const overlayData = ctx.createImageData(canvas.width, canvas.height);
            const overlay = overlayData.data;

            for (const mask of samMaskImages) {
                const [r, g, b] = mask.color;
                for (let j = 0; j < mask.pixels.length; j += 4) {
                    if (mask.pixels[j] > 128) {
                        const alpha = 0.4;
                        overlay[j] = overlay[j] * (1 - alpha) + r * alpha;
                        overlay[j + 1] = overlay[j + 1] * (1 - alpha) + g * alpha;
                        overlay[j + 2] = overlay[j + 2] * (1 - alpha) + b * alpha;
                        overlay[j + 3] = Math.min(255, overlay[j + 3] + 100);
                    }
                }
            }

            const overlayCanvas = document.createElement('canvas');
            overlayCanvas.width = canvas.width;
            overlayCanvas.height = canvas.height;
            const overlayCtx = overlayCanvas.getContext('2d');
            overlayCtx.putImageData(overlayData, 0, 0);
            ctx.drawImage(overlayCanvas, 0, 0);
        }

        function renderOutlinesMode(canvas, ctx, origImg) {
            ctx.drawImage(origImg, 0, 0);

            // Draw outlines for each mask
            for (const mask of samMaskImages) {
                const [r, g, b] = mask.color;
                ctx.strokeStyle = `rgb(${r},${g},${b})`;
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);

                // Find edges by checking neighboring pixels
                const w = canvas.width;
                const h = canvas.height;
                ctx.beginPath();

                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        const idx = (y * w + x) * 4;
                        if (mask.pixels[idx] > 128) {
                            // Check if edge pixel
                            const top = mask.pixels[((y-1) * w + x) * 4] > 128;
                            const bot = mask.pixels[((y+1) * w + x) * 4] > 128;
                            const left = mask.pixels[(y * w + x-1) * 4] > 128;
                            const right = mask.pixels[(y * w + x+1) * 4] > 128;

                            if (!top || !bot || !left || !right) {
                                ctx.rect(x, y, 1, 1);
                            }
                        }
                    }
                }
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // Add hover interaction
            let hoveredMask = -1;
            canvas.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const x = Math.floor((e.clientX - rect.left) * scaleX);
                const y = Math.floor((e.clientY - rect.top) * scaleY);
                const idx = (y * canvas.width + x) * 4;

                let found = -1;
                for (let i = samMaskImages.length - 1; i >= 0; i--) {
                    if (samMaskImages[i].pixels[idx] > 128) {
                        found = i;
                        break;
                    }
                }

                if (found !== hoveredMask) {
                    hoveredMask = found;
                    renderOutlinesMode(canvas, ctx, origImg);

                    if (found >= 0) {
                        const mask = samMaskImages[found];
                        const [r, g, b] = mask.color;

                        // Highlight hovered mask
                        ctx.fillStyle = `rgba(${r},${g},${b},0.3)`;
                        ctx.beginPath();
                        for (let py = 0; py < canvas.height; py++) {
                            for (let px = 0; px < canvas.width; px++) {
                                if (mask.pixels[(py * canvas.width + px) * 4] > 128) {
                                    ctx.rect(px, py, 1, 1);
                                }
                            }
                        }
                        ctx.fill();

                        // Show info
                        const info = document.getElementById('maskInfo');
                        info.style.display = 'block';
                        info.style.left = (e.clientX - canvas.getBoundingClientRect().left + 10) + 'px';
                        info.style.top = (e.clientY - canvas.getBoundingClientRect().top + 10) + 'px';
                        info.innerHTML = `Mask ${found + 1}<br>Area: ${mask.data.area}<br>Score: ${mask.data.score.toFixed(2)}`;
                    } else {
                        document.getElementById('maskInfo').style.display = 'none';
                    }
                }
            };
            canvas.onmouseleave = () => {
                document.getElementById('maskInfo').style.display = 'none';
                hoveredMask = -1;
                renderOutlinesMode(canvas, ctx, origImg);
            };
        }

        function renderCursorMode(canvas, ctx, origImg) {
            ctx.drawImage(origImg, 0, 0);

            canvas.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const x = Math.floor((e.clientX - rect.left) * scaleX);
                const y = Math.floor((e.clientY - rect.top) * scaleY);
                const idx = (y * canvas.width + x) * 4;

                ctx.drawImage(origImg, 0, 0);

                // Find ALL masks under cursor and draw them
                const masksUnderCursor = [];
                for (let i = 0; i < samMaskImages.length; i++) {
                    if (samMaskImages[i].pixels[idx] > 128) {
                        masksUnderCursor.push(samMaskImages[i]);
                    }
                }

                if (masksUnderCursor.length > 0) {
                    const overlayData = ctx.createImageData(canvas.width, canvas.height);
                    const overlay = overlayData.data;

                    for (const mask of masksUnderCursor) {
                        const [r, g, b] = mask.color;
                        for (let j = 0; j < mask.pixels.length; j += 4) {
                            if (mask.pixels[j] > 128) {
                                const alpha = 0.5;
                                overlay[j] = overlay[j] * (1 - alpha) + r * alpha;
                                overlay[j + 1] = overlay[j + 1] * (1 - alpha) + g * alpha;
                                overlay[j + 2] = overlay[j + 2] * (1 - alpha) + b * alpha;
                                overlay[j + 3] = Math.min(255, overlay[j + 3] + 120);
                            }
                        }
                    }

                    const overlayCanvas = document.createElement('canvas');
                    overlayCanvas.width = canvas.width;
                    overlayCanvas.height = canvas.height;
                    const overlayCtx = overlayCanvas.getContext('2d');
                    overlayCtx.putImageData(overlayData, 0, 0);
                    ctx.drawImage(overlayCanvas, 0, 0);

                    // Show info
                    const info = document.getElementById('maskInfo');
                    info.style.display = 'block';
                    info.style.left = (e.clientX - rect.left + 10) + 'px';
                    info.style.top = (e.clientY - rect.top + 10) + 'px';
                    info.innerHTML = `${masksUnderCursor.length} mask(s) under cursor`;
                } else {
                    document.getElementById('maskInfo').style.display = 'none';
                }
            };

            canvas.onmouseleave = () => {
                document.getElementById('maskInfo').style.display = 'none';
                ctx.drawImage(origImg, 0, 0);
            };
        }
